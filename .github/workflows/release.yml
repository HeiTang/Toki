name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check architecture and version tag
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Set up optional Developer ID signing and notarization
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE$CERTIFICATE_PASSWORD$APPLE_ID$APPLE_TEAM_ID$APPLE_APP_PASSWORD" ]]; then
            echo 'No Developer ID credentials: creating an ad-hoc signed release.'
            exit 0
          fi
          : "${CERTIFICATE:?Missing certificate}" "${CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${APPLE_ID:?Missing Apple ID}" "${APPLE_TEAM_ID:?Missing team ID}" "${APPLE_APP_PASSWORD:?Missing app password}"
          keychain="$RUNNER_TEMP/toki-signing.keychain-db"
          password=$(openssl rand -hex 24)
          certificate_file="$RUNNER_TEMP/toki-certificate.p12"
          trap 'rm -f "$certificate_file"' EXIT
          printf '%s' "$CERTIFICATE" | base64 --decode > "$certificate_file"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate_file" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -nE 's/.*"(Developer ID Application:.*)"/\1/p')
          [[ -n "$identity" && "$identity" != *$'\n'* ]] || { echo 'Exactly one Developer ID Application identity is required' >&2; exit 1; }
          xcrun notarytool store-credentials toki-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo 'NOTARY_PROFILE=toki-notary' >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build and run all self-tests
        run: ./build.command
      - name: Notarize if configured, package and verify downloads
        run: ./release.command
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cp docs/release-notes.md "$notes"
          if [[ -n "${NOTARY_PROFILE:-}" ]]; then
            printf '\n此版本已使用 Developer ID 簽章並完成 Apple 公證。\n' >> "$notes"
          else
            printf '\n此版本尚未完成 Apple 公證。首次開啟若被阻擋，請依 README 的安裝說明操作。\n' >> "$notes"
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Toki ${GITHUB_REF_NAME#v}" --notes-file "$notes" \
            dist/Toki-macos-arm64.dmg dist/Toki-macos-arm64.zip dist/SHA256SUMS.txt
      - name: Remove signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/toki-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
